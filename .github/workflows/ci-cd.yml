name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build, Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: medai
          POSTGRES_USER: medai
          POSTGRES_PASSWORD: medai_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Flyway & Unit Tests
        run: |
          cd backend
          mvn clean test --batch-mode

  frontend-build-and-test:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  container-security-scan:
    name: Security & Vulnerability Scan
    needs: [backend-build-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Deploy to Staging (Kubernetes)
    needs: [container-security-scan]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Helm Chart to Staging
        run: |
          echo "Deploying med-ai-assistant to staging cluster via Helm..."
          helm upgrade --install medai-staging ./helm/med-ai-assistant -n medai-staging --create-namespace

  deploy-production:
    name: Deploy to Production (Kubernetes)
    needs: [container-security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Helm Chart to Production
        run: |
          echo "Deploying med-ai-assistant to production cluster via Helm..."
          helm upgrade --install medai-prod ./helm/med-ai-assistant -n medai-prod --create-namespace
