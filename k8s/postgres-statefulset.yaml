apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: medai-prod
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "medai"
            - name: POSTGRES_USER
              value: "medai"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medai-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: medai-prod
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
