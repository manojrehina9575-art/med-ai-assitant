# AWS Application Load Balancer, provisioned by the AWS Load Balancer Controller.
#
# Replaces an nginx + cert-manager ingress pointed at `medai.hospital.internal` — a hostname that
# resolved nowhere. On EKS the ALB controller is the idiomatic choice: TLS terminates at the load
# balancer with an ACM certificate, so there is no cert-manager to run and no private key on the
# cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medai-ingress
  namespace: medai-prod
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_ACM_CERTIFICATE_ARN"
    # TLS 1.2 minimum. TLS 1.0/1.1 in front of PHI is a finding in any security review.
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06

    # Uploads are capped at 100MB by the application; the load balancer must not cut them shorter.
    # A DICOM study routinely exceeds the ALB's 60-second default idle timeout on a slow link.
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/success-codes: '200'

    # Access logs are not optional here: HIPAA 164.312(b) and the DPDP Act both expect a record of
    # access, and the application's own audit trail cannot see requests the app never received.
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=300,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=medai-alb-logs,
      access_logs.s3.prefix=prod

    alb.ingress.kubernetes.io/tags: Environment=production,Application=medai,DataClass=phi
spec:
  ingressClassName: alb
  rules:
    - host: app.medaiclinical.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # The FHIR facade. Routed explicitly because an EHR or ABDM gateway calls it directly,
          # and it must not fall through to the SPA and receive an HTML page.
          - path: /fhir
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
