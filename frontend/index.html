<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ── Block search engine indexing (login-gated app) ── -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">

    <!-- ── Primary ── -->
    <title>Med-AI Clinical — Clinical Documentation Platform</title>
    <meta name="description" content="Med-AI Clinical platform for radiology and pathology report drafting, clinician review, and cryptographic sign-off. FHIR R4, ABDM, DPDP-compliant.">
    <meta name="author" content="Med-AI Clinical">
    <meta name="theme-color" content="#0b6953">

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">

    <!-- ── Open Graph (for branded link previews when shared) ── -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://app.medaiclinical.com/">
    <meta property="og:site_name" content="Med-AI Clinical">
    <meta property="og:title" content="Med-AI Clinical — Clinical Documentation Platform">
    <meta property="og:description" content="AI-powered radiology and pathology report drafting with mandatory physician sign-off. FHIR R4 • ABDM • DPDP.">
    <meta property="og:image" content="https://medaiclinical.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Med-AI Clinical — Clinical Documentation Platform">
    <meta name="twitter:image" content="https://medaiclinical.com/og-image.jpg">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && process.env.NODE_ENV === 'production') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
